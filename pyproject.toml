[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usagi-python"
version = "0.2.0"
description = "치이카와 캐릭터(우사기, 치이카와, 하치와레)처럼 대답하는 터미널 대화 라이브러리"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
usagi = "usagi.cli:main"
chii = "usagi.cli:chii_main"
hachi = "usagi.cli:hachi_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
